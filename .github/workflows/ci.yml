name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Run the full test suite on every OS the skill claims to support, on two
  # Node versions. This is the permanent guard against the cross-platform
  # regressions (mac-only spawns, /bin/sh, spawn("start"), unhandled ENOENT)
  # that otherwise only surface on the partner's Windows machine.
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: Unit + integration tests
        run: npm test
      - name: Adversarial tests
        run: npm run test:adversarial

  # Execute install.sh the way a real user does: clone from GitHub main,
  # install, resolve identity, pass the smoke gate. Runs only on push to main
  # (where the just-pushed commit is already on the remote) so the installer
  # exercises exactly the published flow.
  install-unix:
    name: install.sh (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run install.sh from GitHub
        env:
          INSTALL_ROOT: ${{ runner.temp }}/mvp-install
          SKIP_APPLE_MAIL: "1"
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash

  # Execute install.ps1 end-to-end on a real Windows runner. This is the
  # definitive check that the PowerShell installer is correct, which cannot be
  # validated on a Mac dev box. Push-to-main only, same reason as above.
  install-windows:
    name: install.ps1 (windows-latest)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run install.ps1 from GitHub
        shell: pwsh
        env:
          INSTALL_ROOT: ${{ runner.temp }}\mvp-install
        run: iwr -useb https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
